name: Security Pipeline

'on':
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================
  # STAGE 0 - SETUP
  # ==========================================================
  setup:
    name: "Stage 0 - Setup"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Diagnose project files
        run: |
          echo "Repository root: $(pwd)"
          ls -la

          for file in Dockerfile app.py requirements.txt pyproject.toml; do
            if [ -f "$file" ]; then
              echo "PASS: $file"
            else
              echo "MISSING: $file"
            fi
          done

  # ==========================================================
  # STAGE 1 - QUALITY
  # ==========================================================
  python-quality:
    name: "Stage 1 - Quality"
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Format Python
        run: uv run ruff format .

      - name: Apply Ruff fixes
        run: uv run ruff check --fix .

      - name: Type check with mypy
        run: uv run mypy app.py

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Verify Ruff lint
        run: uv run ruff check .

      - name: Check for uncommitted fixes
        run: git diff --exit-code

  # ==========================================================
  # STAGE 2 - DOCKERFILE LINT
  # ==========================================================
  docker-lint:
    name: "Stage 2 - Docker Lint"
    needs: setup
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v6
  
      - name: Run Hadolint
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            hadolint/hadolint:latest \
            hadolint --format json Dockerfile > hadolint.json
  
      - name: Upload Hadolint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hadolint-report
          path: hadolint.json
          if-no-files-found: ignore

  # ==========================================================
  # STAGE 3 - SAST
  # ==========================================================
  sast:
    name: "Stage 3 - SAST"
    needs: setup
    # runs-on: ubuntu-latest

    # steps:
    #   - uses: actions/checkout@v6

    #   - name: Run Semgrep
    #     continue-on-error: true
    #     run: |
    #       docker run --rm \
    #         -v "$PWD:/src" -w /src \
    #         semgrep/semgrep \
    #         semgrep scan --config auto \
    #         --json --output semgrep.json .
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: semgrep/semgrep
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v6
      - run: semgrep ci

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-report
          path: semgrep.json
          if-no-files-found: ignore

  # ==========================================================
  # STAGE 4 - Trivy Scan AND Syft SBOMS
  # ==========================================================
  container-security:
    name: "Stage 4 - SBOMS"
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t test-pipeline:ci .

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SPDX SBOM
        run: |
          syft test-pipeline:ci \
            -o spdx-json=sbom-spdx.json

      - name: Generate CycloneDX SBOM
        run: |
          syft test-pipeline:ci \
            -o cyclonedx-json=sbom-cyclonedx.json

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-pipeline-sboms
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          if-no-files-found: ignore

      - name: Run Trivy image scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/reports" \
            aquasec/trivy:latest image \
            --format json \
            --output /reports/trivy-image.json \
            test-pipeline:ci

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-image-report
          path: trivy-image.json
          if-no-files-found: ignore

      - name: Run Trivy filesystem scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            aquasec/trivy:latest fs \
            --format json \
            --output trivy-fs.json \
            .

      - name: Upload Trivy filesystem report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-fs-report
          path: trivy-fs.json
          if-no-files-found: ignore

  # ==========================================================
  # STAGE 5 - DAST
  # ==========================================================
  dast:
    name: "Stage 5 - OWASP ZAP"
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t test-pipeline:ci .

      - name: Start application
        run: |
          docker run -d --rm \
            --name test-pipeline \
            -p 8080:8080 \
            test-pipeline:ci

      - name: Wait for application
        run: |
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8080/; then
              exit 0
            fi
            sleep 2
          done

          docker logs test-pipeline
          exit 1

      - name: Prepare report directory
        run: mkdir -p zap-reports

      - name: Run ZAP baseline scan
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:8080 \
            -J zap-report.json \
            -r zap-report.html \
            -I

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: zap-report
          path: zap-reports/
          if-no-files-found: ignore

      - name: Stop application
        if: always()
        run: docker rm -f test-pipeline || true

  # ==========================================================
  # STAGE 6 - SONARQUBE
  # ==========================================================
  sonarqube:
    name: "Stage 6 - DAST"
    needs: setup
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ==========================================================
  # STAGE 7 - FINAL FINDINGS SUMMARY
  # ==========================================================
  summarize-findings:
    name: "Stage 7 - Security Summary"
    if: ${{ always() }}
    needs:
      - setup
      - python-quality
      - docker-lint
      - sast
      - container-security
      - dast
      - sonarqube

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v6
        with:
          path: scan-artifacts
          pattern: "*"
          merge-multiple: false
        continue-on-error: true

      - name: Summarize job results and findings
        env:
          SETUP: ${{ needs.setup.result }}
          PYTHON: ${{ needs.python-quality.result }}
          DOCKER: ${{ needs.docker-lint.result }}
          SAST: ${{ needs.sast.result }}
          CONTAINER: ${{ needs.container-security.result }}
          DAST: ${{ needs.dast.result }}
          SONAR: ${{ needs.sonarqube.result }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("scan-artifacts")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])

          jobs = {
              "Setup": os.environ["SETUP"],
              "Python quality (uv/Ruff/mypy)": os.environ["PYTHON"],
              "Docker lint (Hadolint)": os.environ["DOCKER"],
              "SAST and secrets": os.environ["SAST"],
              "Container security and SBOM": os.environ["CONTAINER"],
              "DAST (OWASP ZAP)": os.environ["DAST"],
              "SonarQube": os.environ["SONAR"],
          }

          lines = [
              "# Security Pipeline Summary",
              "",
              f"Repository: {os.environ['GITHUB_REPOSITORY']}",
              f"Run: {os.environ['GITHUB_SERVER_URL']}/"
              f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
              f"{os.environ['GITHUB_RUN_ID']}",
              "",
              "## Stage results",
              "",
              "| Stage | Result |",
              "|---|---|",
          ]

          for name, result in jobs.items():
              lines.append(f"| {name} | **{result}** |")

          counts = {
              "Hadolint findings": 0,
              "Semgrep findings": 0,
              "Bandit findings": 0,
              "Gitleaks findings": 0,
              "Trivy vulnerabilities": 0,
              "Trivy misconfigurations": 0,
              "Trivy secret findings": 0,
              "ZAP alerts": 0,
          }

          reports = 0
          warnings = []

          for file in root.rglob("*.json") if root.exists() else []:
              reports += 1
              try:
                  data = json.loads(file.read_text())
                  name = file.name.lower()

                  if "hadolint" in name:
                      if isinstance(data, list):
                          counts["Hadolint findings"] += len(data)

                  elif "semgrep" in name:
                      counts["Semgrep findings"] += len(
                          data.get("results", [])
                      )

                  elif "bandit" in name:
                      counts["Bandit findings"] += len(
                          data.get("results", [])
                      )

                  elif "gitleaks" in name:
                      if isinstance(data, list):
                          counts["Gitleaks findings"] += len(data)

                  elif "trivy" in name:
                      for result in data.get("Results", []) or []:
                          counts["Trivy vulnerabilities"] += len(
                              result.get("Vulnerabilities") or []
                          )
                          counts["Trivy misconfigurations"] += len(
                              result.get("Misconfigurations") or []
                          )
                          counts["Trivy secret findings"] += len(
                              result.get("Secrets") or []
                          )

                  elif "zap" in name:
                      for site in data.get("site", []) or []:
                          counts["ZAP alerts"] += len(
                              site.get("alerts", []) or []
                          )

              except (OSError, ValueError, TypeError, AttributeError) as exc:
                  warnings.append(f"{file}: {exc}")

          lines += [
              "",
              "## Findings",
              "",
              "| Scanner | Count |",
              "|---|---:|",
          ]

          for name, count in counts.items():
              lines.append(f"| {name} | {count} |")

          lines += [
              "",
              f"JSON reports discovered: **{reports}**",
              "",
              "> Counts reflect available reports only. ZAP counts represent "
              "alerts, not individual instances. Findings are not deduplicated. "
              "A missing report does not mean zero findings.",
              "",
              "## Artifacts",
              "",
          ]

          artifacts = [
              p for p in root.rglob("*")
              if p.is_file()
          ] if root.exists() else []

          if artifacts:
              for file in artifacts:
                  lines.append(f"- `{file}`")
          else:
              lines.append("No report artifacts were downloaded.")

          sboms = [
              p for p in artifacts
              if "sbom-" in p.name.lower()
          ]

          lines += [
              "",
              "## SBOM status",
              "",
              f"SBOM files available: **{len(sboms)}**",
          ]

          if warnings:
              lines += ["", "## Parsing warnings", ""]
              lines.extend(f"- `{warning}`" for warning in warnings)

          summary_path.write_text("\n".join(lines) + "\n")
          print(summary_path.read_text())
          PY

      - name: Upload consolidated reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consolidated-security-reports
          path: scan-artifacts/
          if-no-files-found: ignore
